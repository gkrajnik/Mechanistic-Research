# WARNING: the full three-model run requires downloading and loading very large checkpoints.
models:
  - {label: 27B, name: google/gemma-3-27b-it, dtype: bfloat16, enabled: true}
  - {label: 12B, name: google/gemma-3-12b-it, dtype: bfloat16, enabled: true}
  - {label: 4B, name: google/gemma-3-4b-it, dtype: bfloat16, enabled: true}
data:
  generic_questions: ../../inputs/generic_questions.csv
  consciousness_questions: ../../inputs/target_questions.csv
  consciousness_conversation: ../../inputs/conversation.json
  chakras_questions: ../../inputs/chakras_questions.csv
  chakras_conversation: ../../inputs/chakras_conversation.json
experiment: {layer: null, seed: 7, output_dir: ../../results/figure11, cache_dir: ../../cache}
probe: {robust: true, regularization_C: 1.0, max_iterations: 2000}
statistics: {bootstrap_samples: 2000, confidence: 0.95}

